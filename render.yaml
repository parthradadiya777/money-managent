databases:
  - name: digitechified-bm-test-db
    databaseName: digitechified_bm_test_db
    user: digitechified_bm_test_db_user
    plan: free
    region: singapore
    postgresMajorVersion: 18

services:
  - type: web
    name: digitechified-bm-test-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digitechified-bm-test-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
