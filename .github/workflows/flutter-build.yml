name: Flutter multi-platform builds

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --dart-define=APP_ENV=test --dart-define=API_BASE_URL=https://digitechified-bm-test-api.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: digitechified-business-manager-web
          path: build/web

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: rm -rf android
      - run: flutter create --platforms=android --org com.digitechified --project-name business_manager .
      - name: Set Android API level 36 for every Android module
        shell: bash
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          cat >> android/build.gradle.kts <<'EOF'

          // Keep all Flutter plugin Android modules aligned with the app compile SDK.
          subprojects {
              afterEvaluate {
                  val androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      val setter = androidExtension.javaClass.methods.firstOrNull {
                          (it.name == "compileSdkVersion" || it.name == "setCompileSdkVersion") &&
                          it.parameterTypes.size == 1 &&
                          (it.parameterTypes[0] == Int::class.javaPrimitiveType || it.parameterTypes[0] == Int::class.java)
                      }
                      setter?.invoke(androidExtension, 36)
                  }
              }
          }
          EOF
          grep -n 'compileSdk' android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=APP_ENV=test --dart-define=API_BASE_URL=https://digitechified-bm-test-api.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: digitechified-business-manager-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
      - run: flutter create --platforms=windows --org com.digitechified --project-name business_manager .
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_ENV=test --dart-define=API_BASE_URL=https://digitechified-bm-test-api.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: digitechified-business-manager-windows
          path: build/windows/x64/runner/Release/

  backend-check:
    name: Check Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Smoke test deployed API (synthetic data only)
        env:
          API_BASE_URL: https://digitechified-bm-test-api.onrender.com
        run: python backend/smoke_test.py
